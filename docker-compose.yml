services:
  builder:
    build: .
    volumes:
      - .:/workspace
      - rust_cache:/cache
      - esp_idf_tools:/home/esp/.espressif
    environment:
      - CARGO_TARGET_DIR=/cache/target
      - CARGO_HOME=/cache/cargo
      - CARGO_INCREMENTAL=1
      - RUSTC_WRAPPER=sccache
      - SCCACHE_DIR=/cache/sccache
      - SCCACHE_CACHE_SIZE=5G
      - CMAKE_C_COMPILER_LAUNCHER=sccache
      - CMAKE_CXX_COMPILER_LAUNCHER=sccache
      - ESP_IDF_TOOLS_INSTALL_DIR=custom:/cache/esp-idf-tools

volumes:
  rust_cache:
  esp_idf_tools:
