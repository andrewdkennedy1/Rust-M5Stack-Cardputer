[package]
name = "cardputer"
version = "0.1.0"
authors = ["Kezi <keziolio123@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.71"

[profile.release]
opt-level = 3
lto = true

[profile.fast]
inherits = "dev"
opt-level = 0
debug = true
incremental = true
codegen-units = 64


[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["std", "embassy", "esp-idf-svc/native", "usb_msc"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = ["esp-idf-svc/embassy-sync", "esp-idf-svc/embassy-time-driver"]
usb_msc = []

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.51", default-features = false }
esp-idf-hal = { version = "0.45" }
#st7789 = "0.7.0"
embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
display-interface-spi = "0.5.0"

embedded-gfx = {git = "https://github.com/Kezii/embedded-gfx.git"}
load_stl = {git = "https://github.com/Kezii/embedded-gfx.git"}

nalgebra = {version = "0.32.3", default-features = false, features = [ "libm" ] }
embedded-hal = "1.0.0"
display-interface = "0.5.0"
rink-core = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/usb_shim"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_tinyusb", version = "1.2" }
bindings_header = "esp_tinyusb_bindings.h"

[patch.crates-io]
esp-idf-sys = { path = "third_party/esp-idf-sys" }
